# Blueprint for the amplifier trigger layer: the web service that receives
# Typefully webhook deliveries and starts workflow runs, plus the Key Value
# instance that records which posts have been announced and which launch pages
# have been pinged. The Workflow service itself is created separately because
# Blueprints don't support Workflows yet.
#
# Order: create the Slack app, create the Workflow service, create the two env
# groups by hand with their values, apply this Blueprint, point the Slack app at
# the receiver (its Interactivity Request URL at /slack/interactivity and its
# OAuth Redirect URL at /slack/oauth/callback), link amplifier-workflow to the
# Workflow service, add the amplifier-kv internal connection string to that group
# as REDIS_URL, then register the receiver's public URL in Typefully under
# Settings > API and copy the signing secret back into TYPEFULLY_WEBHOOK_SECRET.
# The Notion integration comes last, and needs no receiver route.
# docs/deployment.md has the numbered steps.
projects:
  - name: amplifier
    environments:
      - name: Production
        services:
          - type: web
            name: amplifier-webhook
            runtime: node
            plan: starter
            region: oregon
            buildCommand: pnpm install && pnpm build
            startCommand: node dist/webhook-server.js
            healthCheckPath: /healthz
            autoDeployTrigger: commit
            envVars:
              - fromGroup: amplifier-triggers

          - type: keyvalue
            name: amplifier-kv
            plan: starter
            region: oregon
            # noeviction, because the announced markers and the stored Slack
            # user tokens both have to survive memory pressure. An evicted
            # marker re-posts a note; an evicted token costs one re-authorize.
            maxmemoryPolicy: noeviction
            # Reachable only over the private network, so the Workflow service
            # must be in this same workspace and region. Its project and
            # environment do not have to match.
            ipAllowList: []

        envVarGroups:
          # Both groups are created by hand, with their values, before this
          # Blueprint is applied. `sync: false` is ignored inside an env var
          # group, so a group cannot prompt for a value and cannot carry a secret
          # from this file. docs/deployment.md, step 4, lists the keys to add.
          #
          # DISPATCH_TOKEN is deliberately absent. It gates POST /tasks/:task,
          # which nothing in amplifier uses, and leaving it unset makes that route
          # answer 401 to everything. Do not add it to make that route work; it
          # should stay shut.
          - name: amplifier-triggers
            envVars: []

          # Every variable the hand-created Workflow service reads. No service in
          # this Blueprint references this group: the receiver only starts runs.
          # Attach it to the Workflow service in the dashboard. A Blueprint sync
          # leaves the keys added there by hand alone.
          #
          # RENDER_API_KEY and WORKFLOW_SLUG belong in this group too, because
          # the announce path starts the repost reminder's run through the Render
          # API. A key is workspace-wide and a slug is deploy-specific, and
          # `sync: false` is ignored inside an env var group, so both are added
          # by hand. docs/deployment.md, step 4, lists them.
          - name: amplifier-workflow
            envVars:
              - key: AMPLIFIER_SUMMARY_MODEL
                value: anthropic/claude-sonnet-5
              - key: AMPLIFIER_REPOST_EMOJI
                value: white_check_mark
              # The launch page's two property names. Both are display-level
              # Notion settings rather than secrets, so they carry literal
              # values here.
              #
              # NOTION_DATABASE_ID is deliberately absent. It names one
              # workspace's database, and a literal here would overwrite a
              # Dashboard value on every Blueprint sync, so it is added to this
              # group by hand alongside NOTION_TOKEN. docs/deployment.md, step 4,
              # lists it.
              - key: NOTION_TYPEFULLY_PROPERTY
                value: Typefully
              - key: NOTION_OWNERS_PROPERTY
                value: Owner
