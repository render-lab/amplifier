# Runs `pnpm check` — Prettier, ESLint, both tsconfigs, the vitest suite with its
# coverage thresholds, and the build — on every push to main and every pull request.
#
# No secrets are needed. The tests replace Typefully, Anthropic, Slack, and Key
# Value with fakes from test/support, so the suite runs offline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still going for the old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version in package.json's packageManager field. This
      # has to come before setup-node, because `cache: pnpm` needs the pnpm
      # binary to find the store path.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
