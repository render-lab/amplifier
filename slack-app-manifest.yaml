# Slack app definition for amplifier. See docs/deployment.md for how to apply it.
#
# The two URLs below point at the amplifier-webhook receiver, whose hostname does
# not exist until the Blueprint is applied. Replace amplifier-webhook.onrender.com
# with the receiver's real host, or set both URLs in the Slack dashboard after
# deployment.
display_information:
  name: Amplifier
  description: Posts a Slack note when a Render post goes live on X or LinkedIn.
  background_color: "#5a4dc4"
features:
  bot_user:
    display_name: amplifier
    always_online: false
oauth_config:
  # chat:write posts the note and the Reposted-by reply; reactions:write marks a
  # note that has been reposted. users:read.email turns a launch owner's Notion
  # email into a Slack user id and im:write opens the DM, which is how
  # amplifier.pingOwners reaches an owner. Slack only grants users:read.email
  # alongside users:read. The user scope lets a stakeholder's Repost click post
  # as them rather than as the bot.
  scopes:
    bot:
      - chat:write
      - reactions:write
      - users:read
      - users:read.email
      - im:write
    user:
      - chat:write
  redirect_urls:
    - https://amplifier-webhook.onrender.com/slack/oauth/callback
settings:
  interactivity:
    is_enabled: true
    request_url: https://amplifier-webhook.onrender.com/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
